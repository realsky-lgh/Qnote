[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnote"
version = "1.0.0"
description = "极简速记纸：双击Alt呼出，双击~切换丝滑手绘与文字，10款艺术护眼底纹"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.5.0",
    "pynput>=1.7.6",
]

[project.scripts]
qnote = "main:main"
