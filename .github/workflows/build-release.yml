name: Build Cross-Platform Binaries & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pynput pyinstaller

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller --name Qnote --onefile --windowed --add-data "resources/qnote.png;resources" --hidden-import PyQt6.QtCore --hidden-import PyQt6.QtGui --hidden-import PyQt6.QtWidgets --hidden-import PyQt6.QtNetwork --hidden-import pynput.keyboard --hidden-import pynput.keyboard._win32 --collect-all qnote main.py

      - name: Package Windows Binary
        shell: bash
        run: |
          mkdir -p release-pkg
          cp dist/Qnote.exe release-pkg/
          cp README.md release-pkg/
          cd release-pkg && 7z a ../Qnote-windows-x64.zip *

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qnote-windows-x64
          path: Qnote-windows-x64.zip

  build-linux:
    name: Build Linux Binary (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          pip install PyQt6 pynput pyinstaller

      - name: Build Standalone Linux Executable
        run: |
          pyinstaller --name qnote-linux-x86_64 --onefile --windowed --add-data "resources/qnote.png:resources" --hidden-import PyQt6.QtCore --hidden-import PyQt6.QtGui --hidden-import PyQt6.QtWidgets --hidden-import PyQt6.QtNetwork --hidden-import pynput.keyboard --hidden-import pynput.keyboard._xorg --hidden-import pynput.keyboard._uinput --collect-all qnote main.py

      - name: Package Linux Binary
        run: |
          mkdir -p release-pkg
          cp dist/qnote-linux-x86_64 release-pkg/qnote
          chmod +x release-pkg/qnote
          cp README.md release-pkg/
          tar -czvf Qnote-linux-x86_64.tar.gz -C release-pkg qnote README.md

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qnote-linux-x86_64
          path: Qnote-linux-x86_64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Qnote-windows-x64
          path: ./dist-release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Qnote-linux-x86_64
          path: ./dist-release

      - name: List Release Files
        run: |
          echo "Release artifacts:"
          ls -lh dist-release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/Qnote-windows-x64.zip
            dist-release/Qnote-linux-x86_64.tar.gz
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
